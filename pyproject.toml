[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vkjet"
version = "0.1.0"
description = "Jet-row field fitting on Vulkan: arbitrary (<= quadratic) PDE + measurement systems as rows, with per-operator JIT kernels"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "volkano>=0.1.0"]


[tool.setuptools]
packages = ["vkjet", "vkjet.tests"]
include-package-data = true

[tool.setuptools.package-data]
vkjet = ["../shaders/spv/*.spv", "../shaders/*.comp.glsl", "../shaders/build.sh"]
